name: ExpenseFlow MySQL Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: CiRootDemo123
          MYSQL_DATABASE: expenseflow_ci
          MYSQL_USER: expenseflow_ci_app
          MYSQL_PASSWORD: CiAppDemo123
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pCiRootDemo123 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      EXPENSEFLOW_DB_HOST: "127.0.0.1"
      EXPENSEFLOW_DB_PORT: "33306"
      EXPENSEFLOW_DB_NAME: expenseflow_ci
      EXPENSEFLOW_DB_USER: expenseflow_ci_app
      EXPENSEFLOW_DB_PASSWORD: CiAppDemo123
      RUN_MYSQL_TESTS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check for missing migrations
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -q